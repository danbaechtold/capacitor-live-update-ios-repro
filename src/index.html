<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Live Update Repro</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; padding-top: env(safe-area-inset-top, 24px); }
      h1 { font-size: 2.2rem; margin: 12px 0; }
      .row { margin: 8px 0; }
      button { font-size: 1rem; padding: 10px 14px; margin: 4px 6px 4px 0; }
      #log { white-space: pre-wrap; font-family: monospace; font-size: 0.8rem; background: #f4f4f4; padding: 8px; min-height: 200px; }
    </style>
  </head>
  <body>
    <h1 id="marker">...</h1>
    <div class="row">current bundle: <b id="bundle">...</b></div>
    <div class="row">
      <button id="btn-sync">sync()</button>
      <button id="btn-reload">reload()</button>
    </div>
    <div class="row">
      <button id="btn-current">getCurrentBundle()</button>
      <button id="btn-blocked">getBlockedBundles()</button>
    </div>
    <div id="log"></div>
    <script src="./js/app.js" type="module"></script>
  </body>
</html>
